<!doctype html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Thêm báo cáo</title>
    <link rel="stylesheet" href="../css/khong-gian.css">
</head>

<body>
    <main class="view-page">
        <p class="eyebrow">REPORT / NEW ENTRY</p>
        <h1>Thêm <span>báo cáo.</span></h1>
        <form class="report-form"><label>Tiêu đề báo cáo<input type="text" placeholder="Ví dụ: Báo cáo Mun"
                    required></label>
                    <label>Loại báo cáo<select>
                    <option>Báo cáo hành tinh</option>
                    <option>Báo cáo phi hành đoàn</option>
                    <option>Báo cáo nhiệm vụ</option>
                </select></label>
                <label>Người lập báo cáo<input type="text"
                    placeholder="Tên phi hành gia"></label>
                <label>Ngày báo cáo<input type="date"></label>
                <label>Nội dung báo cáo<textarea rows="7" placeholder="Nhập nội dung báo cáo tại đây..."
                    required></textarea></label><button class="button" type="submit">Lưu báo cáo</button></form><a
            class="back" href="bao-cao.html">← Quay lại kho báo cáo</a>
    </main>
</body>

</html>
